# =====================================================================
#  Preset "GTA" — critérios de "momento bom" para lives de GTA V / GTA 6
# =====================================================================
#  Cada trecho da live recebe uma nota calculada a partir de:
#    - volume do áudio (gritos, reação)            -> [pesos].volume
#    - impactos súbitos no som (batida, explosão, tiro) -> [pesos].impacto
#    - fala mais rápida que o normal do streamer   -> [pesos].velocidade_fala
#    - palavras-chave ditas na transcrição         -> [categorias.*]
#    - picos de mensagens no chat (se houver)      -> [pesos].chat
#  Para criar um preset de outro jogo, copie este arquivo e rode:
#    cortar <link> --preset meu_jogo.toml
#
#  Palavras: sem acento e minúsculas (o script normaliza tudo).
#  Um "*" no fim casa qualquer final: "polici*" pega policia, policial...
#  Frases com espaço casam palavras seguidas: "perdi eles".

[geral]
min_clipes = 5
max_clipes = 10
duracao_min = 20          # segundos
duracao_max = 60          # segundos
antes_da_acao = 2.5       # o clipe começa este tanto ANTES da ação subir
depois_da_acao = 2.5      # e termina este tanto depois que ela acalma
intervalo_minimo = 20     # distância mínima entre dois clipes (s)
limiar_relativo = 0.40    # clipes extras só entram se tiverem >= 40% da força do melhor
escala_nota = 4.5         # calibra a nota 0-10 (maior = notas mais baixas)

[transcricao]
modelo = "small"          # tiny | base | small | medium | large-v3-turbo (melhor, mais lento)
idioma = "pt"
dispositivo = "auto"      # auto | cpu | cuda
feixe = 1                 # beam size; 5 = mais preciso e mais lento

[pesos]
volume = 1.0
impacto = 1.2
velocidade_fala = 0.6
palavras = 1.0
chat = 1.0
chat_atraso = 6.0         # o chat reage ~6 s depois do que acontece na tela

[video]
# Layout quando há facecam: "empilhado" (facecam em cima, jogo embaixo)
# Layout sem facecam: "corte" (recorta 9:16 seguindo a ação) ou "desfocado"
# (jogo inteiro no meio com fundo desfocado)
facecam = "auto"          # auto | nao | "x,y,l,a" em fração da tela (ex: "0.72,0.70,0.27,0.29")
altura_facecam = 640      # px da facecam no vídeo final (de 1920)
layout_sem_facecam = "corte"
peso_centro = 0.5         # 0 = segue só o movimento; 1 = sempre o centro da tela
crf = 20                  # qualidade H.264 (menor = melhor/maior)
preset_x264 = "medium"
volume_alvo = -14         # LUFS (padrão de Shorts/Reels/TikTok)

[legenda]
fonte = "Anton"
tamanho = 140
altura = 0.62             # posição vertical do centro da legenda (0 = topo, 1 = base)
cor = "FFFFFF"            # RRGGBB
cor_destaque = "FFE500"   # palavras-chave e gritos
contorno = 9
maiusculas = true
gancho = true             # texto de gancho no topo nos 3 primeiros segundos
gancho_tamanho = 78

[chat]
ativado = true
palavras = ["kkk*", "kekw", "lul", "omegalul", "lmao", "pog*", "w", "f", "rip", "clip*", "eita", "caralho", "porra", "hah*", "insano"]

# --------------------------------------------------------------------
#  Categorias (ordem não importa). peso = quanto cada palavra soma.
